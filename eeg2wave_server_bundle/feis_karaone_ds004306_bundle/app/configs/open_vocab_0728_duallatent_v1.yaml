version: openvoice-eeg-0728-duallatent-v1

data:
  eeg_output_root: ../../eeg_output
  audio_output_root: ../../eeg_output
  eeg_samples: 1280
  eeg_sample_rate: 256
  subject_split_file: split/combined_0715_v1_split.yaml
  montage_registry: ../../eeg_output/open_vocab_0722/montage_registry_track_a.json
  labels_4: ["/tiy/", "/uw/", "gnaw", "pat"]
  labels_11: ["diy", "gnaw", "iy", "knew", "m", "n", "pat", "piy", "pot", "tiy", "uw"]
  internal_split_seed: 15

paths:
  output_root: ../../artifacts/open_vocab_0728_duallatent_v1
  cache_root: ../../artifacts/open_vocab_0728_duallatent_v1/cache/v3
  metric_manifest: ../../artifacts/open_vocab_0728_duallatent_v1/metrics/stss_frozen.json
  audio_checkpoint: ../../artifacts/open_vocab_0728_duallatent_v1/audio/checkpoints/best.pt
  audio_freeze_manifest: ../../artifacts/open_vocab_0728_duallatent_v1/audio/frozen_checkpoint.json
  eeg_semantic_checkpoint: ../../artifacts/open_vocab_0728_duallatent_v1/eeg_semantic4/checkpoints/best.pt
  eeg_dual4_checkpoint: ../../artifacts/open_vocab_0728_duallatent_v1/eeg_dual4/checkpoints/best.pt
  eeg_full_checkpoint: ../../artifacts/open_vocab_0728_duallatent_v1/eeg_full11/checkpoints/best.pt
  locked_test_freeze: ../../artifacts/open_vocab_0728_duallatent_v1/locked_test/freeze_manifest.json
  locked_test_ledger: ../../artifacts/open_vocab_0728_duallatent_v1/locked_test/access_ledger.json

audio:
  sample_rate: 16000
  max_active_seconds: 4.0
  max_samples: 64000
  active_window_ms: 25.0
  active_hop_ms: 10.0
  active_noise_margin_db: 6.0
  active_peak_margin_db: 40.0
  active_close_gap_ms: 50.0
  active_context_ms: 100.0
  target_rms: 0.08
  mel_bins: 80
  mel_frames: 400
  mel_fmin_hz: 0.0
  mel_fmax_hz: 8000.0
  mel_db_min: -80.0
  mel_db_max: 0.0
  n_fft: 512
  win_length: 400
  hop_length: 160
  griffin_lim_iterations: 64

teachers:
  hubert_model: ../../../feis_subject_aware_bundle/models/hubert-base-ls960
  hubert_layer: 9
  hubert_dimension: 768
  content_steps: 50

model:
  linguistic_dimension: 128
  realization_dimension: 64
  content_steps: 50
  mel_bins: 80
  mel_frames: 400
  audio_heads: 4
  audio_transformer_layers: 2
  audio_dropout: 0.10
  eeg_dimension: 128
  eeg_heads: 4
  eeg_transformer_layers: 2
  eeg_patch_size: 64
  eeg_patch_hop: 32
  eeg_dropout: 0.10

training:
  seed: 15
  seeds: [15, 31, 47]
  audio_batch_size: 16
  eeg_batch_size: 8
  audio_epochs: 30
  audio_content_warmup_epochs: 10
  audio_patience: 6
  semantic4_epochs: 12
  semantic4_patience: 4
  dual4_epochs: 18
  dual4_patience: 6
  full11_epochs: 15
  full11_patience: 5
  audio_lr: 0.0003
  eeg_lr: 0.0002
  weight_decay: 0.001
  grad_clip: 1.0
  channel_dropout_max: 0.20
  signal_noise_std: 0.01
  num_workers: 0
  device: auto

loss:
  audio_full_mel: 1.0
  audio_foreground_msssim: 0.5
  audio_content_multipositive: 0.5
  audio_coarse_mel: 1.0
  audio_activity: 0.2
  audio_residual_cycle: 0.1
  semantic_contrastive: 1.0
  semantic_sequence_soft_dtw: 0.5
  semantic_same_label: 0.25
  semantic_coarse_mel: 0.25
  weak_paired_realization: 0.25
  same_subject_label_realization: 0.25
  paired_mel: 0.15
  foreground_structure: 0.30
  eeg_activity: 0.10
  evidence: 0.20
  channel_consistency: 0.10
  contrastive_temperature: 0.08
  soft_dtw_gamma: 0.10
  soft_dtw_band_fraction: 0.25

evaluation:
  time_normalized_frames: 128
  bootstrap_samples: 10000
  metric_group_folds: 6
  metric_positive_auc_minimum: 0.90
  metric_gain_over_best_component: 0.02
  audio_mel_mae_max_db: 12.0
  audio_msssim_minimum: 0.60
  audio_stss_gain_over_label_median: 0.05
  audio_trial_win_rate: 0.60
  audio_variance_ratio_min: 0.25
  audio_variance_ratio_max: 2.0
  four_label_accuracy_minimum: 0.60
  realization_stss_gain_minimum: 0.03
  shuffled_vs_content_stss_gain_minimum: 0.01
  full_vs_content_stss_gain_minimum: 0.05
  minimum_trial_win_rate: 0.60
  content_equivalence_margin: 0.02
  evidence_negative_maximum: 0.10
  evidence_real_minimum: 0.50
  maximum_single_class_fraction: 0.50
  minimum_within_label_variance_ratio: 0.10

gating:
  fail_closed: true
  allow_failed_gates_env: ALLOW_FAILED_GATES
  development_subjects: ["karaone:MM05", "karaone:MM08", "karaone:MM09", "karaone:MM10", "karaone:MM11", "karaone:MM12", "karaone:MM14", "karaone:MM15", "karaone:MM16", "karaone:MM18", "karaone:MM19", "karaone:MM20"]
  diagnostic_subjects: ["karaone:P02", "karaone:MM21"]
