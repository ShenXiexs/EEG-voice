version: openvoice-eeg-0730-explicit-cp-v1

data:
  eeg_sample_rate: 256
  eeg_samples: 1280
  sample_rate: 16000
  audio_root: ../../eeg_output
  unified_manifest: ../../eeg_output/manifests/unified_trials.csv

paths:
  # Input is strictly read-only. Every v0730 write target is isolated below.
  source_cache_root: ../../artifacts/open_vocab_0728_duallatent_v1/cache/v3
  output_root: ../../artifacts/open_vocab_0730_explicit_cp_v1
  prepared_cache: ../../artifacts/open_vocab_0730_explicit_cp_v1/cache/prepared_cp_v1.npz
  split_audit: ../../artifacts/open_vocab_0730_explicit_cp_v1/cache/split_audit.json
  renderer_checkpoint: ../../artifacts/open_vocab_0730_explicit_cp_v1/renderer/checkpoints/best.pt
  eeg_checkpoint: ../../artifacts/open_vocab_0730_explicit_cp_v1/eeg_cp/checkpoints/best.pt
  evaluation_report: ../../artifacts/open_vocab_0730_explicit_cp_v1/evaluation/evaluation.json
  renderer_gate: ../../artifacts/open_vocab_0730_explicit_cp_v1/evaluation/renderer_gate.json
  run_manifest: ../../artifacts/open_vocab_0730_explicit_cp_v1/run_manifest.json
  vocoder_root: ../../artifacts/open_vocab_0730_explicit_cp_v1/models/speecht5_hifigan
  vocoder_manifest: ../../artifacts/open_vocab_0730_explicit_cp_v1/models/speecht5_hifigan_manifest.json
  pair_root: ../../artifacts/open_vocab_0730_explicit_cp_v1/pairs/all_1341

split:
  subject_holdout: ["karaone:MM19", "karaone:MM20"]
  unseen_label: pot
  untouched_subjects: ["karaone:P02", "karaone:MM21"]

content:
  # Cache v3 was built from this frozen local HuBERT layer; no labels enter token fitting.
  source_hubert_layer: 9
  pca_components: 64
  codebook_size: 128
  steps: 16

# Auxiliary only: a frozen phoneme spelling anchor for observed fit labels.
# `pot` is intentionally absent, so it cannot leak into unseen-label training.
text_reference:
  diy: di
  gnaw: no
  iy: i
  knew: nu
  m: m
  n: n
  pat: paet
  piy: pi
  tiy: ti
  uw: u

audio:
  mel_bins: 80
  mel_frames: 400
  max_seconds: 4.0
  target_rms: 0.08
  active_window_ms: 25.0
  active_hop_ms: 10.0
  active_noise_margin_db: 6.0
  active_peak_margin_db: 40.0
  active_context_ms: 100.0

model:
  dimension: 128
  heads: 4
  layers: 2
  dropout: 0.10

training:
  seed: 31
  batch_size: 32
  renderer_epochs: 8
  renderer_patience: 2
  eeg_epochs: 12
  eeg_patience: 3
  renderer_lr: 0.0003
  eeg_lr: 0.0003
  weight_decay: 0.0001
  grad_clip: 1.0
  renderer_wall_hours: 2.5
  eeg_wall_hours: 4.5
  wall_hours: 9.5

evaluation:
  bootstrap_samples: 2000
  bootstrap_seed: 731
  renderer_mel_l1_max_db: 15.0
  swap_mel_change_minimum: 0.005

vocoder:
  repo_id: microsoft/speecht5_hifigan
  sample_rate: 16000
