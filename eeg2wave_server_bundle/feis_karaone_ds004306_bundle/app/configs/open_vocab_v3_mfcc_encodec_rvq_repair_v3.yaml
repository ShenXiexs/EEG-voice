  rvq_blocks: 8
  audio_c_layers: 4
  eeg_layers: 6
  audio_latent_dimension: 128
  audio_residual_limit_log10: 0.8

training:
  wall_hours: 30.0
  rvq_epochs: 160
  rvq_patience: 25
  audio_c_epochs: 150
