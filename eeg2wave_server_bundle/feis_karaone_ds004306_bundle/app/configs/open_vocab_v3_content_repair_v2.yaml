# v3 repair round.  This inherits only immutable protocol fields from the
# original v3 file; runtime rewrites every inherited artifact path into the
# namespace below, so no failed exploratory cache/checkpoint can be reused.
inherits: open_vocab_v3_mfcc_training_first.yaml
version: openvoice-eeg-v3-content-repair-v2

experiment:
  artifact_root_name: open_vocab_v3_content_repair_v2
  schema: openvoice-v3-content-repair-v2
  require_fresh_audio_adaptation: true

exploration:
  output_root_name: open_vocab_v3_content_repair_v2_explore
  gate_policy: record_failures_and_continue

paths:
  output_root: ../../artifacts/open_vocab_v3_content_repair_v2
  prepared_cache: ../../artifacts/open_vocab_v3_content_repair_v2/cache/prepared_content_repair_v2.npz
  prepared_manifest: ../../artifacts/open_vocab_v3_content_repair_v2/cache/prepared_content_repair_v2_manifest.json
  encodec_cache: ../../artifacts/open_vocab_v3_content_repair_v2/cache/encodec_tokens_content_repair_v2.npz
  encodec_cache_manifest: ../../artifacts/open_vocab_v3_content_repair_v2/cache/encodec_tokens_content_repair_v2_manifest.json
  audio_content_checkpoint: ../../artifacts/open_vocab_v3_content_repair_v2/audio_content_repair_v2/checkpoints/best.pt
  token_probe_gate: ../../artifacts/open_vocab_v3_content_repair_v2/gates/T1d_token_encoder_predecoder.json
  cvae_checkpoint: ../../artifacts/open_vocab_v3_content_repair_v2/mfcc_native_mel_cvae_repair_v2/checkpoints/best.pt
  micro_checkpoint: ../../artifacts/open_vocab_v3_content_repair_v2/eeg_content_repair_v2/micro_50/checkpoints/best.pt
  fit_checkpoint: ../../artifacts/open_vocab_v3_content_repair_v2/eeg_content_repair_v2/full_fit/checkpoints/best.pt
  encodec_adapted_root: ../../artifacts/open_vocab_v3_content_repair_v2/models/encodec_24khz_fit_repair_v2
  encodec_manifest: ../../artifacts/open_vocab_v3_content_repair_v2/models/encodec_24khz_fit_repair_v2/adaptation_manifest.json
  vocoder_adapted_root: ../../artifacts/open_vocab_v3_content_repair_v2/models/speecht5_hifigan_fit_repair_v2
  speaker_adapted_checkpoint: ../../artifacts/open_vocab_v3_content_repair_v2/models/ecapa_fit_repair_v2/adapted_backbone.pt
  audio_adaptation_gate: ../../artifacts/open_vocab_v3_content_repair_v2/gates/A0_audio_domain_adaptation.json

audio_adaptation:
  encodec_epochs: 12
  encodec_batch_size: 2
  encodec_lr: 0.00002
  quantizer_adapter_rank: 32
  quantizer_adapter_weight: 0.05
  waveform_l1_weight: 1.0
  stft_weight: 0.25
  si_sdr_weight: 0.10
  envelope_weight: 0.10
  min_relative_loss_improvement: 0.01
  min_changed_parameter_fraction: 0.01

model:
  hubert_teacher_dimension: 768
  hubert_teacher_weight: 0.25
  audio_global_clip_weight: 0.10
  audio_token_consistency_weight: 0.10
  variance_weight: 0.15
  covariance_weight: 0.05
  diversity_weight: 0.10
  content_label_weight: 0.10
  cvae_content_weight: 0.20
  cvae_speaker_weight: 0.10

training:
  # Explicitly split the content chain: EnCodec token supervision first,
  # then frozen-token MFCC reconstruction.  The combined allocation remains
  # the planned 96 audio-content epochs rather than silently doubling it.
  audio_content_encoder_epochs: 48
  audio_content_decoder_epochs: 48
  audio_content_epochs: 96
  audio_lr: 0.00015
  eeg_lr: 0.00010
  fit_epochs: 120
  fit_patience: 12
  warmup_epochs: 8
  text_anchor_enabled: false
  audio_early_stop_patience: 12

gates:
  t1:
    label_top1_min: 0.95
    paired_r_at_1_min: 0.80
    template_ratio_max: 0.50
    variance_ratio_min: 0.50
    token_effective_rank_min: 8.0
    target_covariance_min: 0.25
  t1d:
    label_probe_min: 0.90
    speaker_probe_max: 0.25
