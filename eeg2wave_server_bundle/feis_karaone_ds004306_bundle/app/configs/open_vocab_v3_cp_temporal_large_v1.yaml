  schema: openvoice-v3-cp-temporal-large-v1
  primary_eeg_interpretation: thinking_content_only
  external_audio_policy: frozen_verified_main_adaptation_side_only

exploration:
  output_root_name: open_vocab_v3_cp_temporal_large_v1_explore
  gate_policy: record_failures_and_continue

paths:
  output_root: ../../artifacts/open_vocab_v3_cp_temporal_large_v1
