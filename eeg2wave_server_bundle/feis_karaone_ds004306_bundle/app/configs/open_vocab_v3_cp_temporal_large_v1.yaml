  oracle_checkpoint: ../../artifacts/open_vocab_v3_cp_temporal_large_v1/oracle_deterministic/checkpoints/best.pt
  prosody_checkpoint: ../../artifacts/open_vocab_v3_cp_temporal_large_v1/audio_prosody/checkpoints/best.pt
  content_checkpoint: ../../artifacts/open_vocab_v3_cp_temporal_large_v1/audio_content/checkpoints/best.pt
  cvae_checkpoint: ../../artifacts/open_vocab_v3_cp_temporal_large_v1/residual_cvae/checkpoints/best.pt
  micro_checkpoint: ../../artifacts/open_vocab_v3_cp_temporal_large_v1/eeg_content/micro_50/checkpoints/best.pt
  fit_checkpoint: ../../artifacts/open_vocab_v3_cp_temporal_large_v1/eeg_content/full_fit/checkpoints/best.pt
  eeg_prosody_checkpoint: ../../artifacts/open_vocab_v3_cp_temporal_large_v1/eeg_prosody_exploratory/checkpoints/best.pt
  t0_gate: ../../artifacts/open_vocab_v3_cp_temporal_large_v1/gates/T0_frozen_audio_baselines.json
  oracle_gate: ../../artifacts/open_vocab_v3_cp_temporal_large_v1/gates/T2D_oracle_deterministic.json
  prosody_gate: ../../artifacts/open_vocab_v3_cp_temporal_large_v1/gates/T1P_audio_prosody.json
  content_gate: ../../artifacts/open_vocab_v3_cp_temporal_large_v1/gates/T1C_audio_content.json
  intervention_gate: ../../artifacts/open_vocab_v3_cp_temporal_large_v1/gates/T1CP_four_way_intervention.json
  cvae_gate: ../../artifacts/open_vocab_v3_cp_temporal_large_v1/gates/T2V_residual_cvae.json
  micro_gate: ../../artifacts/open_vocab_v3_cp_temporal_large_v1/gates/C_eeg_content_micro.json
  fit_gate: ../../artifacts/open_vocab_v3_cp_temporal_large_v1/gates/D_eeg_content_full_fit.json
  eeg_prosody_gate: ../../artifacts/open_vocab_v3_cp_temporal_large_v1/gates/P_eeg_prosody_exploratory.json
  training_review: ../../artifacts/open_vocab_v3_cp_temporal_large_v1/gates/E_training_wav_human_review.json
  validation_report: ../../artifacts/open_vocab_v3_cp_temporal_large_v1/evaluation/subject_holdout_seen.json
  locked_report: ../../artifacts/open_vocab_v3_cp_temporal_large_v1/evaluation/locked_seen_label.json
  locked_unseen_report: ../../artifacts/open_vocab_v3_cp_temporal_large_v1/evaluation/locked_unseen_pot_exploratory.json
  micro_preview_root: ../../artifacts/open_vocab_v3_cp_temporal_large_v1/pairs/micro_50_preview
  micro_preview_manifest: ../../artifacts/open_vocab_v3_cp_temporal_large_v1/pairs/micro_50_preview/preview_manifest.json
  fit_preview_root: ../../artifacts/open_vocab_v3_cp_temporal_large_v1/pairs/full_fit_preview
  fit_preview_manifest: ../../artifacts/open_vocab_v3_cp_temporal_large_v1/pairs/full_fit_preview/preview_manifest.json
  pair_root: ../../artifacts/open_vocab_v3_cp_temporal_large_v1/pairs/final
  run_manifest: ../../artifacts/open_vocab_v3_cp_temporal_large_v1/run_manifest.json
  side_adaptation_root: ../../artifacts/open_vocab_v3_cp_temporal_large_v1/audio_adaptation_side
  encodec_adapted_root: ../../artifacts/open_vocab_v3_cp_temporal_large_v1/audio_adaptation_side/encodec
  encodec_manifest: ../../artifacts/open_vocab_v3_cp_temporal_large_v1/audio_adaptation_side/encodec_manifest.json
  vocoder_adapted_root: ../../artifacts/open_vocab_v3_cp_temporal_large_v1/audio_adaptation_side/hifigan
  vocoder_manifest: ../../artifacts/open_vocab_v3_cp_temporal_large_v1/audio_adaptation_side/hifigan_manifest.json
  speaker_adapted_checkpoint: ../../artifacts/open_vocab_v3_cp_temporal_large_v1/audio_adaptation_side/ecapa/adapted_backbone.pt
  speaker_adaptation_manifest: ../../artifacts/open_vocab_v3_cp_temporal_large_v1/audio_adaptation_side/ecapa/adaptation_manifest.json
  audio_adaptation_gate: ../../artifacts/open_vocab_v3_cp_temporal_large_v1/audio_adaptation_side/A0.json

audio:
  canonical_frames: 161
  native_mel_frames: 161
  content_tokens: 96

speaker:
  conditioning: frozen
  model_id: speechbrain/spkrec-ecapa-voxceleb
  embedding_dimension: 192
  reference_trials: 3

model:
  codebook_embedding_dimension: 128
  content_dimension: 256
  content_token_steps: 96
  content_stem_layers: 6
  content_branch_layers: 2
  decoder_layers: 4
  eeg_dimension: 256
  eeg_layers: 6
  heads: 8
  dropout: 0.10
  global_gradient_scale: 0.25
  audio_dimension: 256
  audio_latent_dimension: 128
  local_latent_dimension: 64
  local_latent_steps: 64
  audio_residual_limit_log10: 0.8
  acoustic_blocks: 8
  include_p_plus: true

training:
  seed: 31
  wall_hours: 30.0
  audio_batch_size: 8
  eeg_batch_size: 8
  evaluation_batch_size: 4
  gradient_accumulation: 4
  oracle_epochs: 150
  oracle_patience: 20
  prosody_epochs: 100
  prosody_patience: 15
  content_encoder_epochs: 150
  content_decoder_epochs: 100
  content_joint_epochs: 40
  content_patience: 20
  cvae_epochs: 100
  cvae_patience: 15
  cvae_backbone_frozen_epochs: 20
  cvae_kl_beta_max: 0.002
  cvae_kl_cycle_epochs: 20
  micro_epochs: 600
  micro_patience: 80
  fit_epochs: 200
  fit_patience: 25
  eeg_prosody_epochs: 80
  audio_lr: 0.0002
  cvae_lr: 0.0001
  eeg_micro_lr: 0.0003
  eeg_fit_lr: 0.00006
  eeg_prosody_lr: 0.00006
  joint_lr_scale: 0.10
  weight_decay: 0.0001
  grad_clip: 1.0
  warmup_fraction: 0.05
  channel_dropout: 0.10
  amplitude_jitter: 0.05
  time_shift_samples: 32
  text_anchor_weight: 0.05
  canonical_voice_dropout: 0.0

evaluation:
  batch_size: 4
  bootstrap_samples: 1000
  oracle_per_label: 10
  training_preview_per_label: 5
  variational_samples: 3

gates:
  t0:
    frozen_relative_tolerance: 0.02
  oracle:
    label_top1_min: 0.90
    dtw_gap_min: 0.20
    temporal_std_ratio_min: 0.50
    spectral_change_ratio_min: 0.40
    effective_temporal_rank_min: 8.0
    template_improvement_min: 0.40
    p_plus_relative_improvement_min: 0.05
  prosody:
    activity_f1_min: 0.90
    envelope_corr_min: 0.85
    duration_mae_seconds_max: 0.12
    c0_variance_ratio_min: 0.60
  content:
    global_label_top1_min: 0.90
    hubert_global_retrieval_min: 0.90
    normalized_speaker_advantage_max: 0.15
    template_improvement_min: 0.40
    temporal_variance_ratio_min: 0.50
    attention_coverage_min: 0.80
    token_effective_rank_min: 16.0
    full_r1_min: 0.20
    full_r5_min: 0.60
    full_mrr_min: 0.40
    r1_chance_multiple_min: 20.0
  intervention:
    complete_label_top1_min: 0.90
    complete_temporal_std_ratio_min: 0.50
    complete_template_improvement_min: 0.40
  cvae:
    label_top1_min: 0.90
    dtw_drop_max: 0.03
    posterior_improvement_min: 0.20
    prior_posterior_label_gap_max: 0.05
    residual_rms_ratio_max: 0.30
    diversity_ratio_min: 0.05
    diversity_ratio_max: 0.50
    inactive_active_residual_ratio_max: 0.10
  micro:
    label_top1_min: 0.95
    paired_r_at_1_min: 0.80
    paired_win_rate_min: 0.90
    template_improvement_min: 0.50
    variance_ratio_min: 0.20
  fit:
    label_top1_min: 0.80
    paired_win_rate_min: 0.75
    variance_ratio_min: 0.10

runtime_budget_hours:
  oracle: 4.0
  prosody: 2.0
  content: 4.0
  intervention: 2.0
  cvae: 3.0
  eeg_content: 4.0
  eeg_prosody: 1.0
