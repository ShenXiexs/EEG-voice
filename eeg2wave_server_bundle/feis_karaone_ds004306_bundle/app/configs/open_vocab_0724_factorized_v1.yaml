version: openvoice-eeg-0724-factorized-v1

data:
  track: track_a_common14
  eeg_output_root: ../../eeg_output
  audio_output_root: ../../eeg_output
  eeg_samples: 1280
  eeg_sample_rate: 256
  subject_split_file: split/combined_0715_v1_split.yaml
  label_holdout_file: split/open_vocab_0722_label_folds.yaml
  montage_registry: ../../eeg_output/open_vocab_0722/montage_registry_track_a.json
  pairing_policy_version: openvoice-factorized-pairing-v2
  max_open_payloads: 4

paths:
  output_root: ../../artifacts/open_vocab_0724_factorized_v1
  teacher_cache: ../../artifacts/open_vocab_0724_factorized_v1/cache/teacher_v2
  encodec_model: ../../../karaone_overt_recon_bundle/models/encodec_24khz
  audio_checkpoint: ../../artifacts/open_vocab_0724_factorized_v1/audio/checkpoints/best.pt
  audio_oracle_gate: ../../artifacts/open_vocab_0724_factorized_v1/audio/metrics/audio_oracle_gate.json
  audio_freeze_manifest: ../../artifacts/open_vocab_0724_factorized_v1/audio/frozen_checkpoint.json
  eeg_pretrain_checkpoint: ../../artifacts/open_vocab_0724_factorized_v1/eeg_pretrain/checkpoints/best.pt
  eeg_checkpoint: ../../artifacts/open_vocab_0724_factorized_v1/eeg/checkpoints/best.pt
  validation_report: ../../artifacts/open_vocab_0724_factorized_v1/evaluation/validation_report.json
  validation_gate: ../../artifacts/open_vocab_0724_factorized_v1/evaluation/validation_gate.json

audio:
  sample_rate: 16000
  max_active_seconds: 4.0
  max_samples: 64000
  active_window_ms: 25.0
  active_hop_ms: 10.0
  active_noise_margin_db: 6.0
  active_peak_margin_db: 40.0
  active_close_gap_ms: 50.0
  active_context_ms: 100.0
  target_rms: 0.08
  mel_bins: 80
  mel_frames: 400
  mel_fmin_hz: 0.0
  mel_fmax_hz: 8000.0
  mel_db_min: -80.0
  mel_db_max: 0.0

teachers:
  content_teacher_name: hubert_layer9
  hubert_model: ../../../feis_subject_aware_bundle/models/hubert-base-ls960
  hubert_layer: 9
  hubert_dimension: 768
  content_steps: 50
  wavlm_model: microsoft/wavlm-base-plus-sv
  wavlm_dimension: 512
  wavlm_required: false
  text_auxiliary_enabled: false
  contentvec_ablation_only: true

codec:
  sample_rate: 16000
  max_duration_sec: 4.0
  bandwidth: 6.0
  codebooks: 8
  code_rate_hz: 75
  code_steps: 300
  vocab_size: 1024

model:
  d_model: 192
  condition_steps: 50
  energy_frames: 400
  mel_bins: 80
  content_input_dimension: 768
  timbre_input_dimension: 512
  realization_input_dimension: 84
  audio_encoder_layers: 2
  decoder_layers: 4
  heads: 6
  dropout: 0.10
  branch_dropout_probability: 0.10
  eeg_patch_size: 64
  eeg_patch_hop: 32
  eeg_latent_layers: 3
  eeg_dropout: 0.15
  specialists: 4
  specialist_bottleneck: 48
  soft_routing_epochs: 5
  top_k_specialists: 2
  expert_dropout: 0.10
  adapter_moe_enabled: true
  use_content_condition: true
  use_realization_condition: true
  use_energy_feedback: true
  audio_use_content_condition: true
  audio_use_realization_condition: true
  audio_use_energy_feedback: true
  eeg_use_content_condition: true
  eeg_use_realization_condition: true
  eeg_use_energy_feedback: true

experiment:
  ablation: full_v0724
  same_parameter_count_control: true
  audio_prior: train_primary

training:
  audio_batch_size: 8
  eeg_batch_size: 6
  audio_epochs: 30
  eeg_pretrain_epochs: 20
  eeg_epochs: 40
  audio_lr: 0.0003
  eeg_lr: 0.0002
  weight_decay: 0.001
  grad_clip: 1.0
  early_stopping_patience: 8
  mask_ratio_min: 0.65
  mask_ratio_max: 0.95
  full_mask_probability: 0.50
  patch_mask_ratio: 0.30
  adversary_strength_max: 0.15
  channel_drop_probabilities: [0.10, 0.25, 0.50]
  coordinate_noise_std: 0.005
  signal_noise_std: 0.01
  seed: 15
  seeds: [15, 31, 47]
  num_workers: 0
  precision: fp32
  device: auto

loss:
  audio_code: 1.0
  audio_mel: 1.0
  audio_prosody: 0.25
  content_clip: 1.0
  realization_clip: 1.0
  realization_local: 0.5
  feis_timbre_prototype: 0.25
  mel_l1: 0.5
  mel_soft_dtw: 0.5
  activity_duration_prosody: 0.25
  eeg_code: 0.25
  eeg_masked_pretraining: 1.0
  channel_consistency: 0.20
  cross_covariance: 0.05
  subject_adversarial: 0.05
  dataset_adversarial: 0.05
  timbre_label_adversarial: 0.05
  moe: 0.01
  text: 0.0
  contrastive_temperature: 0.08
  soft_dtw_gamma: 0.10
  soft_dtw_band_fraction: 0.25
  soft_dtw_train_frames: 128
  codebook_weights: [1.0, 1.0, 0.75, 0.60, 0.45, 0.35, 0.25, 0.20]

evaluation:
  maskgit_steps: 12
  synthesis_temperature: 0.0
  time_normalized_frames: 128
  max_envelope_lag_ms: 250
  bootstrap_samples: 1000
  morphology_ssim_minimum_gain: 0.05
  soft_dtw_minimum_relative_gain: 0.05
  retrieval_minimum_chance_multiple: 2.0
  minimum_trial_win_rate: 0.55
  bootstrap_lower_bound: 0.0
  minimum_subjects_for_bootstrap: 2
  maximum_content_cross_factor_ratio: 1.0
  minimum_duration_specificity_margin: 0.0
  audio_oracle:
    minimum_median_lag_envelope_correlation: 0.20
    minimum_median_modulation_correlation: 0.15
    maximum_median_log_mel_mae_db: 12.0
    minimum_median_q0_accuracy: 0.03
    minimum_median_envelope_gain_over_shuffled: 0.02
    minimum_median_log_mel_gain_db_over_shuffled: 0.10

gating:
  require_audio_oracle_before_eeg: true
  locked_test_requires_validation_gate: true
  exact_reconstruction_datasets: [karaone]
  weak_prototype_datasets: [feis]
  audio_ineligible_datasets: [ds004306]
