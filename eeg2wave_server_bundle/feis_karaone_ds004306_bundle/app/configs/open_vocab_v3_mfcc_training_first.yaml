version: openvoice-eeg-v3-encodec-clip-mfcc-v1

# `run_open_vocab_v3_explore_20h.sh` sets OPEN_VOCAB_V3_EXPLORATION=1 and
# redirects all v3 output paths to this sibling root.  The data/model contract
# stays identical, while failed gates can never contaminate primary artifacts.
exploration:
  output_root_name: open_vocab_v3_mfcc_training_first_explore
  gate_policy: record_failures_and_continue

# This file is intentionally an independent v3 namespace.  The v0724/v0730
# caches are read-only sources; no v3 command can write into their directories.
data:
  eeg_sample_rate: 256
  eeg_samples: 1280
  sample_rate: 16000
  audio_root: ../../eeg_output
  unified_manifest: ../../eeg_output/manifests/unified_trials.csv

paths:
  # Immutable feature/split source.  It is only read while constructing v3.
  source_cache_root: ../../artifacts/open_vocab_0728_duallatent_v1/cache/v3
  output_root: ../../artifacts/open_vocab_v3_mfcc_training_first
  # Never reuse the abandoned direct-EEG→MFCC cache/checkpoints.  Those files
  # stay in this artifact root for auditability, but this schema has its own
  # immutable names and every loader checks the schema marker below.
  prepared_cache: ../../artifacts/open_vocab_v3_mfcc_training_first/cache/prepared_encodec_clip_mfcc_v1.npz
  prepared_manifest: ../../artifacts/open_vocab_v3_mfcc_training_first/cache/prepared_encodec_clip_mfcc_v1_manifest.json
  encodec_cache: ../../artifacts/open_vocab_v3_mfcc_training_first/cache/encodec_tokens_fit_v1.npz
  encodec_cache_manifest: ../../artifacts/open_vocab_v3_mfcc_training_first/cache/encodec_tokens_fit_v1_manifest.json
  raw_audio_audit: ../../artifacts/open_vocab_v3_mfcc_training_first/audit/raw_audio_audit.json
  raw_audio_audit_csv: ../../artifacts/open_vocab_v3_mfcc_training_first/audit/raw_audio_audit.csv
  audio_audit: ../../artifacts/open_vocab_v3_mfcc_training_first/audit/audio_audit.json
  audio_audit_csv: ../../artifacts/open_vocab_v3_mfcc_training_first/audit/audio_audit.csv
  denoise_selection: ../../artifacts/open_vocab_v3_mfcc_training_first/denoise/selection.csv
  denoise_root: ../../artifacts/open_vocab_v3_mfcc_training_first/denoise/wav
  denoise_manifest: ../../artifacts/open_vocab_v3_mfcc_training_first/denoise/manifest.json
  speaker_model_root: ../../artifacts/open_vocab_v3_mfcc_training_first/models/speechbrain_ecapa
  speaker_adapted_checkpoint: ../../artifacts/open_vocab_v3_mfcc_training_first/models/speechbrain_ecapa_karaone_fit/adapted_backbone.pt
  speaker_adaptation_manifest: ../../artifacts/open_vocab_v3_mfcc_training_first/models/speechbrain_ecapa_karaone_fit/adaptation_manifest.json
  speaker_manifest: ../../artifacts/open_vocab_v3_mfcc_training_first/models/speechbrain_ecapa_manifest.json
  vocoder_root: ../../artifacts/open_vocab_v3_mfcc_training_first/models/speecht5_hifigan
  vocoder_base_manifest: ../../artifacts/open_vocab_v3_mfcc_training_first/models/speecht5_hifigan_base_manifest.json
  vocoder_adapted_root: ../../artifacts/open_vocab_v3_mfcc_training_first/models/speecht5_hifigan_karaone_fit
  encodec_root: ../../../karaone_overt_recon_bundle/models/encodec_24khz
  encodec_adapted_root: ../../artifacts/open_vocab_v3_mfcc_training_first/models/encodec_24khz_karaone_fit_v1
  encodec_manifest: ../../artifacts/open_vocab_v3_mfcc_training_first/models/encodec_24khz_karaone_fit_v1/adaptation_manifest.json
  vocoder_manifest: ../../artifacts/open_vocab_v3_mfcc_training_first/models/speecht5_hifigan_manifest.json
  audio_adaptation_gate: ../../artifacts/open_vocab_v3_mfcc_training_first/gates/A0_audio_domain_adaptation.json
  hubert_root: ../../../feis_subject_aware_bundle/models/hubert-base-ls960
  audio_content_checkpoint: ../../artifacts/open_vocab_v3_mfcc_training_first/audio_content_encodec_v1/checkpoints/best.pt
  cvae_checkpoint: ../../artifacts/open_vocab_v3_mfcc_training_first/mfcc_native_mel_cvae_v1/checkpoints/best.pt
  micro_checkpoint: ../../artifacts/open_vocab_v3_mfcc_training_first/eeg_encodec_clip_mfcc_v1/micro_50/checkpoints/best.pt
  fit_checkpoint: ../../artifacts/open_vocab_v3_mfcc_training_first/eeg_encodec_clip_mfcc_v1/full_fit/checkpoints/best.pt
  t0_gate: ../../artifacts/open_vocab_v3_mfcc_training_first/gates/T0_encodec_roundtrip.json
  t0b_gate: ../../artifacts/open_vocab_v3_mfcc_training_first/gates/T0b_native_speecht5_roundtrip.json
  t1_gate: ../../artifacts/open_vocab_v3_mfcc_training_first/gates/T1_audio_tokens_to_mfcc.json
  t1d_gate: ../../artifacts/open_vocab_v3_mfcc_training_first/gates/T1d_content_timbre_probe.json
  t2_gate: ../../artifacts/open_vocab_v3_mfcc_training_first/gates/T2_mfcc_canonical_voice.json
  t2v_gate: ../../artifacts/open_vocab_v3_mfcc_training_first/gates/T2v_variational_validity.json
  t3_gate: ../../artifacts/open_vocab_v3_mfcc_training_first/gates/T3_voice_swap.json
  micro_gate: ../../artifacts/open_vocab_v3_mfcc_training_first/gates/C_encodec_clip_50_pair_overfit.json
  fit_gate: ../../artifacts/open_vocab_v3_mfcc_training_first/gates/D_encodec_clip_full_fit.json
  validation_report: ../../artifacts/open_vocab_v3_mfcc_training_first/evaluation/subject_holdout_seen.json
  locked_report: ../../artifacts/open_vocab_v3_mfcc_training_first/evaluation/locked_seen_label.json
  locked_unseen_report: ../../artifacts/open_vocab_v3_mfcc_training_first/evaluation/locked_unseen_pot_exploratory.json
  micro_preview_root: ../../artifacts/open_vocab_v3_mfcc_training_first/pairs/micro_50_preview
  micro_preview_manifest: ../../artifacts/open_vocab_v3_mfcc_training_first/pairs/micro_50_preview/preview_manifest.json
  fit_preview_root: ../../artifacts/open_vocab_v3_mfcc_training_first/pairs/full_fit_preview
  fit_preview_manifest: ../../artifacts/open_vocab_v3_mfcc_training_first/pairs/full_fit_preview/preview_manifest.json
  training_review: ../../artifacts/open_vocab_v3_mfcc_training_first/gates/E_training_wav_human_review.json
  pair_root: ../../artifacts/open_vocab_v3_mfcc_training_first/pairs/encodec_clip_mfcc_training_fit_v1
  run_manifest: ../../artifacts/open_vocab_v3_mfcc_training_first/run_manifest.json
  # Kept here as well as under data because evaluation/export need these
  # read-only locations without writing to them.
  audio_root: ../../eeg_output
  unified_manifest: ../../eeg_output/manifests/unified_trials.csv

split:
  subject_holdout: ["karaone:MM19", "karaone:MM20"]
  unseen_label: pot

audio:
  # Light cleaning only: DC removal (inside the shared preparer), deterministic
  # VAD crop, RMS normalization, and a fixed padded T_max with its masks.
  sample_rate: 16000
  target_rms: 0.08
  max_active_seconds: 2.56
  canonical_frames: 256
  mfcc_bins: 40
  mel_bins: 80
  n_fft: 512
  mel_db_min: -80.0
  mel_db_max: 0.0
  encodec_sample_rate: 24000
  encodec_bandwidth: 6.0
  encodec_codebooks: 8
  encodec_codebook_size: 1024
  encodec_steps: 192
  content_tokens: 32
  native_mel_frames: 160
  low_contrast_db_threshold: 6.0
  manual_review_sample_keys:
    - "karaone:MM18:94"
    - "karaone:MM14:36"
    - "karaone:MM16:56"

denoise:
  enabled: true
  # Default branch has no external pretrained parameters. DeepFilterNet may
  # still be selected manually, but then it is an optional preprocessing-only
  # audit branch and is never part of the EEG generator.
  backend: DeterministicSpectralGateV1
  processing_sample_rate: 16000
  compensate_delay: true
  post_filter: false
  attenuation_limit_db: 18.0
  auto_select_low_contrast: false
  max_envelope_lag_ms: 30.0
  max_vad_boundary_shift_ms: 40.0
  max_duration_change_ms: 30.0
  min_hubert_dtw_cosine: 0.90
  min_ecapa_cosine: 0.90

# Immutable source-Mel contract used only by V0.  These values match
# configs/open_vocab_0728_duallatent_v1.yaml and its cache builder.
v0_source_mel:
  source_config: open_vocab_0728_duallatent_v1.yaml
  sample_rate: 16000
  n_fft: 512
  win_length: 400
  hop_length: 160
  window: hann
  center: true
  mel_bins: 80
  mel_frames: 400
  fmin_hz: 0.0
  fmax_hz: 8000.0
  db_min: -80.0
  db_max: 0.0
  scale: power_db_10log10

speaker:
  # The EEG path never receives these features.  They are V1/V2 audio-only.
  model_id: speechbrain/spkrec-ecapa-voxceleb
  embedding_dimension: 192
  reference_trials: 3

audio_adaptation:
  # Scientific/primary path.  The separate transductive runner can use all
  # eligible WAVs, but its checkpoint is never consumed by held-out reports.
  primary_scope: fit
  encodec_epochs: 6
  encodec_batch_size: 2
  encodec_lr: 0.00001
  vocoder_epochs: 6
  vocoder_batch_size: 2
  vocoder_lr: 0.00001
  speaker_epochs: 6
  speaker_batch_size: 4
  speaker_lr: 0.00001
  min_relative_loss_improvement: 0.01
  min_changed_parameter_fraction: 0.50
  waveform_l1_weight: 0.10
  envelope_weight: 0.10
  stft_fft_sizes: [512, 1024, 2048]
  stft_hop_sizes: [128, 256, 512]

teachers:
  hubert_layer: 9

model:
  audio_dimension: 128
  audio_latent_dimension: 32
  audio_residual_limit_log10: 3.0
  eeg_dimension: 128
  heads: 4
  layers: 2
  dropout: 0.10
  content_dimension: 128
  content_layers: 2
  content_token_steps: 32
  speaker_adversarial_weight: 0.05

training:
  seed: 31
  audio_batch_size: 16
  eeg_batch_size: 10
  audio_epochs: 32
  audio_content_epochs: 48
  audio_patience: 5
  micro_epochs: 240
  fit_epochs: 80
  fit_patience: 8
  audio_lr: 0.0003
  eeg_lr: 0.0003
  weight_decay: 0.0001
  grad_clip: 1.0
  # Never pair a canonical voice condition with another speaker's target Mel.
  canonical_voice_dropout: 0.0
  cvae_kl_beta_max: 0.02
  cvae_kl_warmup_epochs: 12
  cvae_free_bits: 0.05
  cvae_prior_reconstruction_weight: 0.35
  cvae_analytic_consistency_weight: 0.05
  wall_hours: 20.0

micro_gate:
  subject: "karaone:MM05"
  per_label: 5

evaluation:
  batch_size: 8
  bootstrap_samples: 1000
  oracle_per_label: 5
  training_preview_per_label: 5
  variational_samples: 3

gates:
  t0:
    label_top1_min: 0.95
    hubert_dtw_min: 0.90
    ssim_min: 0.90
    logmel_mae_db_max: 6.0
    frozen_relative_degradation_max: 0.05
  t0b:
    label_top1_min: 0.90
    hubert_dtw_min: 0.80
    dtw_gap_min: 0.20
  t1:
    label_top1_min: 0.95
    paired_r_at_1_min: 0.80
    template_ratio_max: 0.50
    variance_ratio_min: 0.50
  t1d:
    label_probe_min: 0.90
    speaker_probe_max: 0.25
  t2:
    label_top1_min: 0.90
    dtw_gap_min: 0.20
    prior_posterior_label_gap_max: 0.05
  t2v:
    posterior_analytic_improvement_min: 0.20
    label_top1_min: 0.90
  t3:
    speaker_swap_margin_min: 0.03
    target_over_p90_fraction_min: 0.80
    content_change_max: 0.05
  micro:
    label_top1_min: 0.95
    paired_r_at_1_min: 0.80
    template_ratio_max: 0.50
    variance_ratio_min: 0.10
    paired_win_rate_min: 0.90
  fit:
    label_top1_min: 0.80
    paired_r_at_1_min: 0.20
    variance_ratio_min: 0.10
    paired_win_rate_min: 0.75

vocoder:
  repo_id: microsoft/speecht5_hifigan
  sample_rate: 16000
  # The only Mel space permitted after this schema upgrade.  It is used in
  # adaptation, T0b, CVAE, and every export; no legacy power-dB /10 adapter.
  native_contract: speecht5_native_log_mel_v1
  n_fft: 1024
  win_length: 1024
  hop_length: 256
  fmin_hz: 80.0
  fmax_hz: 7600.0
  mel_scale: slaney
  mel_norm: slaney
