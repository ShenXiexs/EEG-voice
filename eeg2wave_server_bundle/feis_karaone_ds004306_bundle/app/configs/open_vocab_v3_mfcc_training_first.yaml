version: openvoice-eeg-v3-mfcc-training-first

# This file is intentionally an independent v3 namespace.  The v0724/v0730
# caches are read-only sources; no v3 command can write into their directories.
data:
  eeg_sample_rate: 256
  eeg_samples: 1280
  sample_rate: 16000
  audio_root: ../../eeg_output
  unified_manifest: ../../eeg_output/manifests/unified_trials.csv

paths:
  # Immutable feature/split source.  It is only read while constructing v3.
  source_cache_root: ../../artifacts/open_vocab_0728_duallatent_v1/cache/v3
  output_root: ../../artifacts/open_vocab_v3_mfcc_training_first
  prepared_cache: ../../artifacts/open_vocab_v3_mfcc_training_first/cache/prepared_mfcc_v3.npz
  prepared_manifest: ../../artifacts/open_vocab_v3_mfcc_training_first/cache/prepared_mfcc_v3_manifest.json
  audio_audit: ../../artifacts/open_vocab_v3_mfcc_training_first/audit/audio_audit.json
  audio_audit_csv: ../../artifacts/open_vocab_v3_mfcc_training_first/audit/audio_audit.csv
  speaker_model_root: ../../artifacts/open_vocab_v3_mfcc_training_first/models/speechbrain_ecapa
  speaker_manifest: ../../artifacts/open_vocab_v3_mfcc_training_first/models/speechbrain_ecapa_manifest.json
  vocoder_root: ../../artifacts/open_vocab_v3_mfcc_training_first/models/speecht5_hifigan
  vocoder_manifest: ../../artifacts/open_vocab_v3_mfcc_training_first/models/speecht5_hifigan_manifest.json
  hubert_root: ../../../feis_subject_aware_bundle/models/hubert-base-ls960
  audio_checkpoint: ../../artifacts/open_vocab_v3_mfcc_training_first/audio_oracle/checkpoints/best.pt
  micro_checkpoint: ../../artifacts/open_vocab_v3_mfcc_training_first/eeg_mfcc/micro_50/checkpoints/best.pt
  fit_checkpoint: ../../artifacts/open_vocab_v3_mfcc_training_first/eeg_mfcc/full_fit/checkpoints/best.pt
  v0_gate: ../../artifacts/open_vocab_v3_mfcc_training_first/gates/V0_vocoder_oracle.json
  v1_gate: ../../artifacts/open_vocab_v3_mfcc_training_first/gates/V1_content_audio_oracle.json
  v2_gate: ../../artifacts/open_vocab_v3_mfcc_training_first/gates/V2_timbre_audio_oracle.json
  micro_gate: ../../artifacts/open_vocab_v3_mfcc_training_first/gates/C_50_pair_overfit.json
  fit_gate: ../../artifacts/open_vocab_v3_mfcc_training_first/gates/D_full_fit.json
  validation_report: ../../artifacts/open_vocab_v3_mfcc_training_first/evaluation/subject_holdout_seen.json
  locked_report: ../../artifacts/open_vocab_v3_mfcc_training_first/evaluation/locked_seen_label.json
  locked_unseen_report: ../../artifacts/open_vocab_v3_mfcc_training_first/evaluation/locked_unseen_pot_exploratory.json
  pair_root: ../../artifacts/open_vocab_v3_mfcc_training_first/pairs/training_fit_eligible
  run_manifest: ../../artifacts/open_vocab_v3_mfcc_training_first/run_manifest.json
  # Kept here as well as under data because evaluation/export need these
  # read-only locations without writing to them.
  audio_root: ../../eeg_output
  unified_manifest: ../../eeg_output/manifests/unified_trials.csv

split:
  subject_holdout: ["karaone:MM19", "karaone:MM20"]
  unseen_label: pot

audio:
  # Light cleaning only: DC removal (inside the shared preparer), deterministic
  # VAD crop, RMS normalization, and a fixed padded T_max with its masks.
  sample_rate: 16000
  target_rms: 0.08
  max_active_seconds: 2.56
  canonical_frames: 256
  mfcc_bins: 40
  mel_bins: 80
  n_fft: 512
  mel_db_min: -80.0
  mel_db_max: 0.0
  low_contrast_db_threshold: 6.0
  manual_review_sample_keys:
    - "karaone:MM18:94"
    - "karaone:MM14:36"
    - "karaone:MM16:56"

# Immutable source-Mel contract used only by V0.  These values match
# configs/open_vocab_0728_duallatent_v1.yaml and its cache builder.
v0_source_mel:
  source_config: open_vocab_0728_duallatent_v1.yaml
  sample_rate: 16000
  n_fft: 512
  win_length: 400
  hop_length: 160
  window: hann
  center: true
  mel_bins: 80
  mel_frames: 400
  fmin_hz: 0.0
  fmax_hz: 8000.0
  db_min: -80.0
  db_max: 0.0
  scale: power_db_10log10

speaker:
  # The EEG path never receives these features.  They are V1/V2 audio-only.
  model_id: speechbrain/spkrec-ecapa-voxceleb
  embedding_dimension: 192
  reference_trials: 3

teachers:
  hubert_layer: 9

model:
  audio_dimension: 128
  eeg_dimension: 128
  heads: 4
  layers: 2
  dropout: 0.10

training:
  seed: 31
  audio_batch_size: 16
  eeg_batch_size: 10
  audio_epochs: 32
  audio_patience: 5
  micro_epochs: 240
  fit_epochs: 80
  fit_patience: 8
  audio_lr: 0.0003
  eeg_lr: 0.0003
  weight_decay: 0.0001
  grad_clip: 1.0
  canonical_voice_dropout: 0.25
  wall_hours: 9.5

micro_gate:
  subject: "karaone:MM05"
  per_label: 5

evaluation:
  batch_size: 8
  bootstrap_samples: 1000
  oracle_per_label: 5

gates:
  v0:
    label_top1_min: 0.90
    dtw_gap_min: 0.20
  v1:
    mfcc_template_ratio_max: 0.50
    label_top1_min: 0.90
    dtw_gap_min: 0.20
  v2:
    speaker_swap_margin_min: 0.03
    content_change_max: 0.05
  micro:
    label_top1_min: 0.95
    paired_r_at_1_min: 0.80
    template_ratio_max: 0.50
    variance_ratio_min: 0.10
    paired_win_rate_min: 0.90
  fit:
    label_top1_min: 0.80
    paired_r_at_1_min: 0.20
    variance_ratio_min: 0.10
    paired_win_rate_min: 0.75

vocoder:
  repo_id: microsoft/speecht5_hifigan
  sample_rate: 16000
