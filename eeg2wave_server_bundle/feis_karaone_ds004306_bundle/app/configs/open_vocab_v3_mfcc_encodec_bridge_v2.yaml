inherits: open_vocab_v3_cp_temporal_large_v1.yaml
version: openvoice-v3-mfcc-encodec-bridge-v2

experiment:
  artifact_root_name: open_vocab_v3_mfcc_encodec_bridge_v2
  schema: openvoice-v3-mfcc-encodec-bridge-v2
  primary_eeg_interpretation: thinking_EEG_C_plus_fit_only_fixed_P_and_voice
  external_audio_policy: frozen_encodec_primary_adaptation_side_only

exploration:
  output_root_name: open_vocab_v3_mfcc_encodec_bridge_v2_explore
  gate_policy: record_failures_and_continue_without_heldout

paths:
