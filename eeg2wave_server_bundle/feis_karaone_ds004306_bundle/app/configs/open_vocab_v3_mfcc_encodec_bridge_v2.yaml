  encodec_cache_manifest: ../../artifacts/open_vocab_v3_cp_temporal_large_v1/cache/frozen_encodec_bridge_targets_v2_manifest.json
  bridge_checkpoint: ../../artifacts/open_vocab_v3_cp_temporal_large_v1/encodec_latent_bridge_v2/checkpoints/best.pt
  audio_c_checkpoint: ../../artifacts/open_vocab_v3_cp_temporal_large_v1/audio_c_teacher_v2/checkpoints/best.pt
  micro_m0_checkpoint: ../../artifacts/open_vocab_v3_cp_temporal_large_v1/eeg_c_v2/m0_memorization/checkpoints/best.pt
  micro_m1_checkpoint: ../../artifacts/open_vocab_v3_cp_temporal_large_v1/eeg_c_v2/m1_micro_generalization/checkpoints/best.pt
  micro_m0_predictions: ../../artifacts/open_vocab_v3_cp_temporal_large_v1/eeg_c_v2/m0_memorization/predictions.npz
  micro_m1_predictions: ../../artifacts/open_vocab_v3_cp_temporal_large_v1/eeg_c_v2/m1_micro_generalization/predictions.npz
  a0_gate: ../../artifacts/open_vocab_v3_cp_temporal_large_v1/gates/A0_bridge_audit.json
  e0_gate: ../../artifacts/open_vocab_v3_cp_temporal_large_v1/gates/E0_frozen_encodec_roundtrip.json
  e1_gate: ../../artifacts/open_vocab_v3_cp_temporal_large_v1/gates/E1_real_C_real_P_independent_voice.json
  e2_gate: ../../artifacts/open_vocab_v3_cp_temporal_large_v1/gates/E2_canonical_P_canonical_voice.json
  b0_gate: ../../artifacts/open_vocab_v3_cp_temporal_large_v1/gates/B0_bridge_frozen.json
  c1_gate: ../../artifacts/open_vocab_v3_cp_temporal_large_v1/gates/C1_audio_C_teacher.json
  c2_gate: ../../artifacts/open_vocab_v3_cp_temporal_large_v1/gates/C2_predicted_C_frozen_bridge.json
  m0_gate: ../../artifacts/open_vocab_v3_cp_temporal_large_v1/gates/M0_eeg_C_memorization.json
  m1_gate: ../../artifacts/open_vocab_v3_cp_temporal_large_v1/gates/M1_eeg_C_micro_generalization.json
  training_review: ../../artifacts/open_vocab_v3_cp_temporal_large_v1/gates/H_training_wav_human_review.json
  preview_root: ../../artifacts/open_vocab_v3_cp_temporal_large_v1/pairs/training_and_micro_preview
  preview_manifest: ../../artifacts/open_vocab_v3_cp_temporal_large_v1/pairs/training_and_micro_preview/manifest.json
  run_manifest: ../../artifacts/open_vocab_v3_cp_temporal_large_v1/run_manifest.json

audio:
  canonical_frames: 161
  native_mel_frames: 161
  content_tokens: 96
  canonical_p_bank_size: 4

speaker:
  conditioning: frozen
  reference_trials: 3

model:
  codebook_embedding_dimension: 128
  content_dimension: 256
  content_stem_layers: 6
  content_branch_layers: 2
  decoder_layers: 4
  eeg_dimension: 256
  eeg_layers: 6
  heads: 8
  dropout: 0.10
  global_gradient_scale: 0.25
  bridge_dimension: 256
  bridge_blocks: 8
  encodec_latent_dimension: 128

training:
  seed: 31
  wall_hours: 30.0
  audio_batch_size: 6
  eeg_batch_size: 8
  evaluation_batch_size: 2
  bridge_epochs: 120
  bridge_patience: 20
  audio_c_epochs: 150
  audio_c_patience: 25
  micro_m0_epochs: 600
  micro_m0_patience: 80
  micro_m1_epochs: 400
  micro_m1_patience: 60
  bridge_lr: 0.0002
  audio_c_lr: 0.0002
  eeg_micro_lr: 0.0003
  weight_decay: 0.0001
  grad_clip: 1.0
  global_gradient_scale: 0.25

evaluation:
  batch_size: 2
  bridge_oracle_per_label: 5
  preview_per_label: 5
  bootstrap_samples: 1000

gates:
  e1:
    label_top1_min: 0.90
    c_ablation_gain_min: 0.30
    dtw_gap_min: 0.20
    p_only_label_max: 0.30
    voice_only_label_max: 0.20
    template_improvement_min: 0.40
  c1:
    hubert_global_retrieval_min: 0.90
    template_improvement_min: 0.40
    temporal_variance_ratio_min: 0.50
  m0:
    label_top1_min: 0.95
    paired_r1_min: 0.80
    control_win_rate_min: 0.90
    variance_ratio_min: 0.20
  m1:
    label_chance_multiple_min: 3.0
    paired_chance_multiple_min: 2.0
    control_win_rate_min: 0.75

runtime_budget_hours:
  bridge: 8.0
  audio_c: 10.0
  m0: 5.0
  m1: 7.0
