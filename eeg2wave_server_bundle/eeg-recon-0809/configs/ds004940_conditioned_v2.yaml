schema_version: ds004940-conditioned-v2
data_config: ../configs/training_data_v4_ds004940_fixed.yaml
audit_required_nonzero_datasets: [ds004940]

split:
  protocol: joint_ood
  fold: 0
  locked_test: true

stage2:
  datasets: [ds004940]
  protocol: stage2_ds004940_conditioned_v2
  explore_artifact_set: explore_stage2_ds004940_conditioned_v2
  explore_target_name: speech_targets_explore_stage2_ds004940_conditioned_v2
  explore_normalizer_name: explore_stage2_ds004940_conditioned_v2_fold-0
  assignment_name: stage2_ds004940_conditioned_v2_assignment
  split_report_name: stage2_ds004940_conditioned_v2_split

model:
  dimension: 192
  heads: 6
  layers: 4
  local_layers: 2
  dropout: 0.1
  token_steps: 96
  target_frames: 161
  mfcc_dimension: 39
  hubert_dimension: 768
  phoneme_classes: 64
  zero_centered: true

loss:
  mfcc: 1.0
  delta: 0.2
  local_alignment: 0.5
  global_clip: 0.5
  phoneme_auxiliary: 0.1
  duration: 0.05
  activity: 0.05
  counterfactual_rank: 0.20
  counterfactual_margin: 0.02
  variance_retention: 0.10
  variance_floor_fraction: 0.25
  weak_content_weight: 0.35

training:
  batch_size: 8
  learning_rate: 0.0003
  lr_schedule: cosine
  min_learning_rate: 0.00003
  weight_decay: 0.01
  grad_clip: 1.0
  max_steps: 5000
  checkpoint_interval_steps: 50
  train_screen_interval_steps: 100
  seeds: [31, 47, 73]
  label_only_batch_interval: 5
  early_stop_pair_retrieval_r1: 0.90
  stage2_requires_all_m0_gates: true
  sampling_strategy: shuffled_without_replacement
  content_grouped_batch:
    contents_per_batch: 4
    subjects_per_content: 2
  validation_early_stopping:
    interval_epochs: 2
    minimum_epochs: 20
    patience_validations: 8
    minimum_delta: 0.0001
    required_controls: [zero, time_block_shuffle, channel_shuffle, wrong_trial]

pilot:
  overfit_pairs_per_dataset: 50
  overfit_subjects_per_dataset: 5
  overfit_contents_per_dataset: 10
  generalization_subjects_per_dataset: 8
  generalization_contents_per_dataset: 160
  generalization_subjects_by_role: {train: 4, validation: 2, test: 2}
  generalization_contents_by_role: {train: 128, validation: 16, test: 16}
  generalization_label_contents_by_role: {train: 7, validation: 2, test: 2}
  max_train_trials_per_dataset: 512
  max_validation_trials_per_dataset: 32
  max_test_trials_per_dataset: 32
  label_only_max_overfit_pairs: 0
  label_only_max_generalization_pairs: 0
  primary_ds004940_task: N400Active
  primary_ds006104_tms: false

controls: [zero, time_block_shuffle, channel_shuffle, wrong_trial]
gates:
  overfit:
    content_retrieval_r1_min: 0.90
    template_improvement_min: 0.50
    collapse_baseline: dataset_mean
    correct_must_beat: [zero, time_block_shuffle, channel_shuffle, wrong_trial]
  generalization:
    paired_control_ci_low_min: 0.0

native_audio:
  local_hifigan_path: ../feis_karaone_ds004306_bundle/artifacts/open_vocab_v3_mfcc_training_first_explore/models/speecht5_hifigan
  train_contents_only: true
  oracle_hubert_local_min: 0.90
  oracle_retrieval_r1_min: 0.90
  renderer_mel_improvement_min: 0.10
  diffusion:
    # Optional audio-only native-mel refinement.  The shell runner overrides
    # this with DIFFUSION_DENOISE=1 without changing EEG training.
    enabled: false
    hidden_dimension: 96
    layers: 4
    dropout: 0.05
    timesteps: 100
    beta_start: 0.0001
    beta_end: 0.02
    sampling_steps: 16
    train_steps: 2000
    batch_size: 8
    learning_rate: 0.0002
    weight_decay: 0.0001
    grad_clip: 1.0
    seed: 31
    validation_mel_improvement_min: 0.02
