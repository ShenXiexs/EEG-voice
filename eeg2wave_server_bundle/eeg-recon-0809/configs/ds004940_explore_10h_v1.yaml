schema_version: ds004940-single-explore-10h-v1
data_config: ../configs/training_data_v3.yaml
split:
  protocol: joint_ood
  fold: 0
  locked_test: true

# This is deliberately a DS004940-only artifact namespace.  It neither
# rebuilds DS006104 nor reuses any completed joint/single checkpoint.
stage2:
  datasets: [ds004940]
  protocol: stage2_ds004940_explore_10h_v1
  explore_artifact_set: explore_stage2_ds004940_10h_v1
  explore_target_name: speech_targets_explore_stage2_ds004940_10h_v1
  explore_normalizer_name: explore_stage2_ds004940_10h_v1_fold-0
  assignment_name: stage2_ds004940_explore_10h_v1_assignment
  split_report_name: stage2_ds004940_explore_10h_v1_split

# Preserve the validated EEGCP/Conformer model and loss definitions from the
# previous pilot.  The main experimental change is more strict-OOD train data,
# not an untraceable architecture change.
model:
  dimension: 192
  heads: 6
  layers: 4
  local_layers: 2
  dropout: 0.1
  token_steps: 96
  target_frames: 161
  mfcc_dimension: 39
  hubert_dimension: 768
  phoneme_classes: 64

loss:
  mfcc: 1.0
  delta: 0.2
  local_alignment: 0.5
  global_clip: 0.5
  phoneme_auxiliary: 0.1
  weak_content_weight: 0.35

training:
  batch_size: 8
  learning_rate: 0.0003
  # The earlier 2,400-step fixed learning rate is unsuitable for a much
  # longer run.  Cosine decay retains the existing initial LR but reaches a
  # conservative floor at the end of each seed's 9,000 steps.
  lr_schedule: cosine
  min_learning_rate: 0.00003
  weight_decay: 0.01
  grad_clip: 1.0
  max_steps: 9000
  checkpoint_interval_steps: 100
  seeds: [31, 47, 73]
  dataset_batch_ratio: [1, 1]
  label_only_batch_interval: 5
  early_stop_pair_retrieval_r1: 0.90
  stage2_requires_all_m0_gates: true

runtime_budget:
  total_hours: 10.0
  expected_seconds_per_step: 0.92
  # 3 × 9,000 × 0.92 s = 6.9 h training at the observed previous rate.
  # The remaining budget is for source-target cache, EEG shards, evaluation,
  # and a realistic slowdown allowance on MPS.
  reserve_hours_for_artifacts_evaluation_and_slowdown: 3.1

pilot:
  overfit_pairs_per_dataset: 50
  overfit_subjects_per_dataset: 5
  overfit_contents_per_dataset: 10
  # The rich single-dataset pilot keeps the same four train subjects as the
  # initial M1 but expands from 28 to 128 mutually held-out sentence contents.
  # One validation and one locked-test subject prevent subject leakage; each
  # has 16 unseen contents rather than the earlier six.
  generalization_subjects_per_dataset: 6
  generalization_contents_per_dataset: 160
  generalization_subjects_by_role:
    train: 4
    validation: 1
    test: 1
  generalization_contents_by_role:
    train: 128
    validation: 16
    test: 16
  generalization_label_contents_by_role:
    train: 7
    validation: 2
    test: 2
  max_train_trials_per_dataset: 512
  max_validation_trials_per_dataset: 16
  max_test_trials_per_dataset: 16
  label_only_max_overfit_pairs: 50
  label_only_max_generalization_pairs: 128
  primary_ds004940_task: N400Active
  primary_ds006104_tms: false

controls: [zero, time_shuffle, channel_shuffle, wrong_pair]
gates:
  overfit:
    content_retrieval_r1_min: 0.90
    template_improvement_min: 0.50
    collapse_baseline: dataset_mean
    correct_must_beat: [zero, time_shuffle, channel_shuffle]
  generalization:
    joint_gain_bootstrap_ci_low_min: 0.0

audio_renderer:
  hidden_dimension: 128
  layers: 4
  dropout: 0.1
  max_steps: 2000
  batch_size: 16
  learning_rate: 0.0003
  log_mel_weight: 1.0
  rms_weight: 0.2
  activity_weight: 0.2
  gate_log_mel_improvement_min: 0.10
  gate_activity_f1_min: 0.70
