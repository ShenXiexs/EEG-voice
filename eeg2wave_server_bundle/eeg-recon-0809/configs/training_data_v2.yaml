harmonized:
  target_sfreq_hz: 256
  bandpass_hz: [0.5, 45.0]
  reference: average
  interpolation:
    max_bad_fraction: 0.15
    ds004940_montage: biosemi128
    ds006104_montage: standard_1020
  units: V
  dtype: float32
  epoch:
    ds004940:
      source_sfreq_hz: 512
      pre_samples_source: 128
      total_samples_source: 2356
      total_samples_target: 1178
      eeg_zero_index: 64
      post_sentence_s: 0.5
    ds006104:
      source_sfreq_hz: 2000
      pre_samples_source: 500
      post_samples_source: 2500
      total_samples_target: 384
      eeg_zero_index: 64
      response_onset_relative_s: 0.3
      clean_perception_end_target_index: 140
  tms:
    source_code: mcjpedro/speech_decoding@6cf2db37ee42eeeaccb29343239e416f69e9498d:matlab_code/analysis_bids.m
    source_code_sha256: 5b8fc952455320dda755d0850ff230c850b41fae68f34cf0bed911b610bedc23
    pulse_1_relative_to_stimulus_s: -0.1
    pulse_2_relative_to_stimulus_s: -0.05
