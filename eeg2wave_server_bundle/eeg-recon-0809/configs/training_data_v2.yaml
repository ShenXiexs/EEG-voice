    interval_half_open_offsets_source_samples: [-10, 51]
    interpolation_algorithm: linear_endpoints_harmonized

audio:
  target_sample_rate: 16000
  mono_mix: arithmetic_mean
  resampling: torchaudio_bandlimited_sinc
  peak_normalization: none
  rms_normalization: none
  dc_removal: false
  clipping: false
  max_samples:
    ds004940: 64000
    ds006104: 20000
  mel:
    n_fft: 400
    win_length: 400
    hop_length: 160
    window_fn: hann
    power: 2.0
    normalized: false
    center: false
    pad: 0
    pad_mode: reflect
    onesided: true
    n_mels: 80
    f_min: 50.0
    f_max: 7600.0
    norm: slaney
    mel_scale: slaney
    log_transform: natural_log
    log_epsilon: 1.0e-10
