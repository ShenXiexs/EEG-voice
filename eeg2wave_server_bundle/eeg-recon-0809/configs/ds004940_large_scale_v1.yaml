schema_version: ds004940-large-scale-explore-v1
data_config: ../configs/training_data_v3.yaml
split:
  protocol: joint_ood
  fold: 0
  locked_test: true

# Isolated artifacts: never overwrite the completed 512-pair 10-hour run.
stage2:
  datasets: [ds004940]
  protocol: stage2_ds004940_large_scale_v1
  explore_artifact_set: explore_stage2_ds004940_large_scale_v1
  explore_target_name: speech_targets_explore_stage2_ds004940_large_scale_v1
  explore_normalizer_name: explore_stage2_ds004940_large_scale_v1_fold-0
  assignment_name: stage2_ds004940_large_scale_v1_assignment
  split_report_name: stage2_ds004940_large_scale_v1_split

# Same EEGCP/Conformer and target-space model as the validated small-scale run.
model:
  dimension: 192
  heads: 6
  layers: 4
  local_layers: 2
  dropout: 0.1
  token_steps: 96
  target_frames: 161
  mfcc_dimension: 39
  hubert_dimension: 768
  phoneme_classes: 64

loss:
  mfcc: 1.0
  delta: 0.2
  local_alignment: 0.5
  global_clip: 0.5
  phoneme_auxiliary: 0.1
  weak_content_weight: 0.35

training:
  batch_size: 8
  learning_rate: 0.0003
  lr_schedule: cosine
  min_learning_rate: 0.00003
  weight_decay: 0.01
  grad_clip: 1.0
  # 3,380 / 8 = 423 batches per complete shuffled epoch; 50 epochs = 21,150 steps.
  max_epochs: 50
  sampling_strategy: shuffled_without_replacement
  checkpoint_interval_steps: 100
  train_screen_interval_steps: 423
  seeds: [31, 47, 73]
  dataset_batch_ratio: [1, 1]
  label_only_batch_interval: 5
  early_stop_pair_retrieval_r1: 0.90
  stage2_requires_all_m0_gates: true
  validation_early_stopping:
    selection_metric: mfcc_retrieval_mrr
    interval_epochs: 2
    minimum_epochs: 20
    patience_validations: 8
    minimum_delta: 0.0001

pilot:
  overfit_pairs_per_dataset: 50
  overfit_subjects_per_dataset: 5
  overfit_contents_per_dataset: 10
  # Fourteen N400Active subjects cover all 402 stimuli after applying the locked
  # <=15% declared-bad-channel rule.  Content and subject roles stay disjoint.
  generalization_subjects_per_dataset: 14
  generalization_contents_per_dataset: 402
  generalization_subjects_by_role:
    train: 10
    validation: 2
    test: 2
  generalization_contents_by_role:
    train: 338
    validation: 32
    test: 32
  generalization_label_contents_by_role:
    train: 7
    validation: 2
    test: 2
  max_train_trials_per_dataset: 3380
  max_validation_trials_per_dataset: 64
  max_test_trials_per_dataset: 64
  label_only_max_overfit_pairs: 50
  label_only_max_generalization_pairs: 128
  primary_ds004940_task: N400Active
  primary_ds006104_tms: false

controls: [zero, time_shuffle, channel_shuffle, wrong_pair]
gates:
  overfit:
    content_retrieval_r1_min: 0.90
    template_improvement_min: 0.50
    collapse_baseline: dataset_mean
    correct_must_beat: [zero, time_shuffle, channel_shuffle]
  generalization:
    joint_gain_bootstrap_ci_low_min: 0.0

audio_renderer:
  hidden_dimension: 128
  layers: 4
  dropout: 0.1
  max_steps: 2000
  batch_size: 16
  learning_rate: 0.0003
  log_mel_weight: 1.0
  rms_weight: 0.2
  activity_weight: 0.2
  gate_log_mel_improvement_min: 0.10
  gate_activity_f1_min: 0.70
